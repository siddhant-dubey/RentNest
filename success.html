<!DOCTYPE html>
<html>
<head>
  <title>Order Success</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-box fade-in" style="text-align:center;">

  <!-- SUCCESS ICON -->
  <div class="success-circle">
    ✓
  </div>

  <h2>Payment Successful 🎉</h2>

  <p>Your order has been placed successfully.</p>

  <h3>Total Paid: ₹<span id="totalPaid"></span></h3>

  <p>Thank you for choosing <b>RentNest</b></p>

  <br>

  <a href="index.html" class="btn">🏠 Go Home</a>
  <br><br>
  <a href="packages.html" class="btn">🛒 Order Again</a>

</div>

<script>
// show total paid
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;

cart.forEach(item => {
  total += item.price * item.qty;
});

document.getElementById("totalPaid").innerText = total;

// clear cart AFTER showing total
localStorage.removeItem("cart");
</script>

</body>
</html>
