<!DOCTYPE html>
<html>
<head>
  <title>Packages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <h2>🏠 RentNest</h2>
  <div>
    <input type="text" id="search" placeholder="Search..." onkeyup="searchItems()">
    <a href="cart.html">🛒 Cart</a>
  </div>
</div>

<!-- PACKAGES -->
<h2 style="text-align:center;">📦 Packages</h2>

<div class="container" id="packagesContainer">

  <div class="card item">
    <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c">
    <h3>Starter Kit</h3>
    <p>Gas + Utensils + Fan</p>
    <p><b>₹2000/month</b></p>
    <p>⭐ 4.5</p>
    <button class="btn" onclick="selectPackage('Starter Kit',2000)">Select</button>
  </div>

  <div class="card item">
    <img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2">
    <h3>2BHK Kit</h3>
    <p>AC + Fridge + Bed</p>
    <p><b>₹5000/month</b></p>
    <p>⭐ 4.8</p>
    <button class="btn" onclick="selectPackage('2BHK Kit',5000)">Select</button>
  </div>

</div>

<!-- ITEMS -->
<h2 style="text-align:center;">🛒 Individual Items</h2>

<div class="container" id="itemsContainer">

  <div class="card item">
    <img src="https://images.unsplash.com/photo-1606813907291-d86efa9b94db">
    <h3>Gas Cylinder</h3>
    <p>₹500/month</p>
    <p>⭐ 4.5</p>
    <button class="btn" onclick="addItem('Gas Cylinder',500)">Add</button>
  </div>

  <div class="card item">
    <img src="https://images.unsplash.com/photo-1590794056226-79ef3a8147e1">
    <h3>Gas Stove</h3>
    <p>₹400/month</p>
    <p>⭐ 4.2</p>
    <button class="btn" onclick="addItem('Gas Stove',400)">Add</button>
  </div>

  <div class="card item">
    <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952">
    <h3>Air Conditioner</h3>
    <p>₹1500/month</p>
    <p>⭐ 4.8</p>
    <button class="btn" onclick="addItem('AC',1500)">Add</button>
  </div>

  <div class="card item">
    <img src="https://images.unsplash.com/photo-1621905251918-48416bd8575a">
    <h3>Air Cooler</h3>
    <p>₹800/month</p>
    <p>⭐ 4.3</p>
    <button class="btn" onclick="addItem('Cooler',800)">Add</button>
  </div>

</div>

<script>
// ✅ PACKAGE SELECT
function selectPackage(name, price) {

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let existing = cart.find(item => item.name === name);

  if(existing){
    existing.qty += 1;
  } else {
    cart.push({name: name, price: price, qty: 1});
  }

  localStorage.setItem("cart", JSON.stringify(cart));

  alert(name + " added to cart!");
}

// ✅ ADD ITEM WITH QTY
function addItem(name, price) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let existing = cart.find(i => i.name === name);

  if(existing){
    existing.qty += 1;
  } else {
    cart.push({name, price, qty:1});
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  alert(name + " added!");
}

// ✅ SEARCH (WORKS FOR BOTH PACKAGES + ITEMS)
function searchItems(){
  let input = document.getElementById("search").value.toLowerCase();
  let items = document.getElementsByClassName("item");

  for(let i=0;i<items.length;i++){
    let text = items[i].innerText.toLowerCase();
    items[i].style.display = text.includes(input) ? "block" : "none";
  }
}
</script>

</body>
</html>
